[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petromodeler"
version = "0.1.0"
description = "Streamlit geochemical process modeling and plotting tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.31",
    "numpy>=1.23",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["petromodeler*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["petromodeler"]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
